<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rounding &middot; IEEE 754 Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="{{ url_for('index') }}" class="brand">
        <span class="brand">
        <span class="brand-mark"></span>IEEE&nbsp;754&nbsp;COMPUTING&nbsp;MACHINE
      </span>
      </a>
      <a href="{{ url_for('index') }}" class="back-link">&larr; Menu</a>
    </div>
  </header>

  <main class="wrap main-content">

    <section class="intro">
      <span class="module-address module-address--page">0x01</span>
      <h1>Rounding</h1>
      <p>One value, four ways to cut it off.</p>
    </section>

    <form id="rounding-form" class="panel form-panel" autocomplete="off">

      <fieldset class="field-group">
        <legend class="field-label">Input format</legend>
        <div class="radio-row" role="radiogroup" aria-label="Input format">
          <label class="radio-option">
            <input type="radio" name="base" value="decimal" checked>
            <span>Decimal</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="base" value="binary">
            <span>Binary</span>
          </label>
        </div>
      </fieldset>

      <div class="field-group">
        <label for="round-value-input" class="field-label" id="value-label">Decimal number</label>
        <input
          type="text"
          id="round-value-input"
          name="value"
          placeholder="e.g. 3.14159, -2.5, 2.675"
          inputmode="decimal"
          required
        >
      </div>

      <div class="field-group">
        <label for="round-target-input" class="field-label" id="target-label">Target digits after rounding-off</label>
        <input
          type="number"
          id="round-target-input"
          name="target"
          min="0"
          step="1"
          value="2"
          required
        >
      </div>

      <button type="submit" class="btn-primary">Round</button>

    </form>

    <p id="error-message" class="error-message" hidden></p>

    <section id="result-panel" class="panel result-panel" hidden>

      <div class="result-echo">
        <span id="out-echo"></span>
      </div>

      <div class="rounding-grid">
        <div class="rounding-card">
          <span class="rounding-mode-label">Truncated</span>
          <span class="rounding-mode-sub">round toward zero</span>
          <span id="out-truncated" class="rounding-mode-value"></span>
        </div>
        <div class="rounding-card">
          <span class="rounding-mode-label">Rounded up</span>
          <span class="rounding-mode-sub">round toward +&infin;</span>
          <span id="out-rounded-up" class="rounding-mode-value"></span>
        </div>
        <div class="rounding-card">
          <span class="rounding-mode-label">Rounded down</span>
          <span class="rounding-mode-sub">round toward &minus;&infin;</span>
          <span id="out-rounded-down" class="rounding-mode-value"></span>
        </div>
        <div class="rounding-card rounding-card--highlight">
          <span class="rounding-mode-label">Ties to even</span>
          <span class="rounding-mode-sub">nearest, IEEE 754 default</span>
          <span id="out-ties-to-even" class="rounding-mode-value"></span>
        </div>
      </div>

    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>sign · exponent · mantissa</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
