<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arithmetic &middot; IEEE 754 Machine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="wrap header-row">
      <a href="{{ url_for('index') }}" class="brand">
        IEEE&nbsp;754&nbsp;COMPUTING&nbsp;MACHINE
      </a>
      <a href="{{ url_for('index') }}" class="back-link">&larr; Menu</a>
    </div>
  </header>

  <main class="wrap main-content">

    <section class="intro">
      <span class="module-address module-address--page">0x02</span>
      <h1>Arithmetic</h1>
      <p>Add or multiply two operands, bit by bit.</p>
    </section>

    <form id="arithmetic-form" class="panel form-panel" autocomplete="off">

      <div class="operand-grid">

        <fieldset class="field-group operand-fieldset">
          <legend class="field-label">Operand A</legend>
          <div class="radio-row radio-row--compact" role="radiogroup" aria-label="Operand A format">
            <label class="radio-option">
              <input type="radio" name="format_a" value="decimal" checked>
              <span>Decimal</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="format_a" value="hex">
              <span>Hex</span>
            </label>
          </div>
          <input
            type="text"
            id="value-a-input"
            name="value_a"
            placeholder="e.g. 3.14159"
            required
          >
        </fieldset>

        <fieldset class="field-group operand-fieldset">
          <legend class="field-label">Operand B</legend>
          <div class="radio-row radio-row--compact" role="radiogroup" aria-label="Operand B format">
            <label class="radio-option">
              <input type="radio" name="format_b" value="decimal" checked>
              <span>Decimal</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="format_b" value="hex">
              <span>Hex</span>
            </label>
          </div>
          <input
            type="text"
            id="value-b-input"
            name="value_b"
            placeholder="e.g. 3.14159"
            required
          >
        </fieldset>

      </div>

      <fieldset class="field-group">
        <legend class="field-label">Operation</legend>
        <div class="radio-row" role="radiogroup" aria-label="Operation">
          <label class="radio-option">
            <input type="radio" name="operation" value="addition" checked>
            <span>Addition (A + B)</span>
          </label>
          <label class="radio-option">
            <input type="radio" name="operation" value="multiplication">
            <span>Multiplication (A &times; B)</span>
          </label>
        </div>
      </fieldset>

      <button type="submit" class="btn-primary">Compute</button>

    </form>

    <p id="error-message" class="error-message" hidden></p>

    <section id="result-panel" class="panel result-panel" hidden>

      <div class="result-echo">
        <span id="out-echo"></span>
      </div>

      <div class="bitfield" aria-label="32-bit layout">
        <div class="bit-group bit-group--sign">
          <span class="bit-group-label">Sign</span>
          <span id="out-sign" class="bit-group-value">0</span>
          <span class="bit-group-caption">1 bit</span>
        </div>
        <div class="bit-group bit-group--exponent">
          <span class="bit-group-label">Exponent</span>
          <span id="out-exponent" class="bit-group-value">00000000</span>
          <span class="bit-group-caption">8 bits</span>
        </div>
        <div class="bit-group bit-group--mantissa">
          <span class="bit-group-label">Mantissa</span>
          <span id="out-mantissa" class="bit-group-value">00000000000000000000000</span>
          <span class="bit-group-caption">23 bits</span>
        </div>
      </div>

      <div class="result-row">
        <span class="result-label">Binary</span>
        <span id="out-binary" class="result-value result-value--mono"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Hex</span>
        <span id="out-hex" class="result-value result-value--mono"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Decimal</span>
        <span id="out-decimal" class="result-value result-value--mono"></span>
      </div>

      <h2 class="steps-heading">Step-by-step</h2>
      <ol id="steps-list" class="steps-list"></ol>

    </section>

  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>sign · exponent · mantissa</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
